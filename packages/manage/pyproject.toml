[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-manage"
version = "0.1.0"
description = "Daily position-management evaluation of the live account against a configurable ruleset -- advice only"
requires-python = ">=3.11"
license = "MIT"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this one.
# Not on PyPI (Private :: Do Not Upload) -- packages/core must be installed first, or resolution fails.
dependencies = ["cherrypick-core"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["tests", "src"]

[tool.ruff]
# line-length + lint.select come from the suite-wide ../../ruff.toml.
extend = "../../ruff.toml"
target-version = "py311"

[tool.hatch.build.targets.wheel]
# src-layout PEP 420 namespace: src/cherrypick/ has NO __init__.py, so cherrypick.manage composes
# with cherrypick.core (and every other module) under one cherrypick.* root. `sources = ["src"]` maps
# the src/ prefix away, so src/cherrypick.manage/... installs as cherrypick.manage/... .
only-include = ["src/cherrypick"]
sources = ["src"]
