[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-calendars"
version = "0.1.0"
description = "Weekly SPX double-calendar paper module — a forward exit-parameter experiment"
requires-python = ">=3.11"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this one.
# Not on PyPI (Private :: Do Not Upload) -- packages/core must be installed first, or resolution fails.
# Deliberately NO broker dependency: this module is a pure stream-cache consumer on its paper path
# (the flies posture) -- no keyring, no tastytrade, no REST. Chain metadata for its two expirations
# comes from the streamer's `expirations` request field, not from a broker call of its own.
dependencies = ["cherrypick-core"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["tests", "src"]

[tool.ruff]
# line-length + lint.select come from the suite-wide ../../ruff.toml.
extend = "../../ruff.toml"
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
# src-layout PEP 420 namespace: src/cherrypick/ has NO __init__.py, so cherrypick.calendars composes
# with cherrypick.core (and every other module) under one cherrypick.* root. `sources = ["src"]` maps
# the src/ prefix away, so src/cherrypick/calendars/... installs as cherrypick/calendars/... .
only-include = ["src/cherrypick"]
sources = ["src"]
