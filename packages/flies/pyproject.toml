[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-flies"
version = "0.1.0"
description = "0DTE net-credit butterfly paper module — measuring the 'profit forest' net of costs"
requires-python = ">=3.11"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this one.
# Not on PyPI (Private :: Do Not Upload) -- packages/core must be installed first, or resolution fails.
# tastytrade: broker_cli.py imports it (deferred) for real order/quote calls, and the live-scaffold
# tests exercise it directly -- undeclared until now (discovered via a from-scratch venv install; the
# shared dev venv had it already, transitively, from meic/earnings, which masked the gap). Pinned to
# match meic's floor, the suite's other live-trading module.
dependencies = ["keyring>=24", "cherrypick-core", "tastytrade>=12.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["tests", "src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# book.py, cli.py, paper_loop.py self-insert `src` onto sys.path (so a bare `import clock`/`db`/`engine`
# resolves) before their own local imports -- not a cherrypick-core bootstrap, just this package's own
# flat-layout sibling imports.
"src/book.py" = ["E402"]
"src/cli.py" = ["E402"]
"src/paper_loop.py" = ["E402"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
