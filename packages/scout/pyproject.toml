[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-scout"
version = "0.1.0"
description = "Scout — self-hosted options research surface (calendar, screener, symbol view, payoff builder)"
requires-python = ">=3.11"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this one.
# Not on PyPI (Private :: Do Not Upload) -- packages/core must be installed first, or resolution fails.
# tastytrade floor pinned to the repo-wide version already in use elsewhere (do not bump here alone).
dependencies = [
    "cherrypick-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2",
    "tastytrade>=12.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths  = ["tests"]
pythonpath = ["tests", "src"]

[tool.ruff]
# line-length + lint.select come from the suite-wide ../../ruff.toml.
extend = "../../ruff.toml"
target-version = "py311"
# New package -- E501 stays enforced rather than deferred like the older trading modules.

[tool.hatch.build.targets.wheel]
# src-layout PEP 420 namespace: src/cherrypick/ has NO __init__.py, so cherrypick.scout composes with
# cherrypick.core (and every other module) under one cherrypick.* root. `sources = ["src"]` maps the
# src/ prefix away, so src/cherrypick/scout/... installs as cherrypick/scout/... .
only-include = ["src/cherrypick"]
sources = ["src"]
