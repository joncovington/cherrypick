<div class="card" id="builder-view" data-symbol="$symbol">
  <h2>Builder <span class="note">$symbol -- click a strike to add a leg</span></h2>
  <div class="builder-row">
    <label>Expiration <select id="builder-expiration"></select></label>
    <label>Spot <input id="builder-spot" type="number" step="0.01"></label>
    <label>IV <input id="builder-iv" type="number" step="0.01"></label>
  </div>
  <div id="builder-warnings"></div>
  <div id="builder-chain" class="builder-chain"></div>
  <div class="builder-row">
    <div id="builder-basket" class="builder-basket">
      <h3>Legs</h3>
      <ul id="builder-legs"></ul>
    </div>
    <div id="builder-metrics" class="builder-metrics"></div>
  </div>
  <svg id="builder-svg" class="builder-svg" viewBox="0 0 640 280" preserveAspectRatio="none"></svg>
  <div class="builder-row">
    <label>Note <input id="builder-note" type="text" placeholder="optional"></label>
    <div class="builder-actions">
      <button id="builder-validate" type="button">Validate with broker</button>
      <button id="builder-stage" type="button">Stage ticket</button>
    </div>
  </div>
  <p id="builder-validation" class="note">Staging only -- no order is ever submitted.</p>
</div>
