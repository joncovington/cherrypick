<div class="card" id="builder-view" data-symbol="$symbol" x-data="builderStore()" x-init="init()">
  <h2>Builder <span class="note">$symbol -- click a strike to add a leg</span></h2>

  <section class="builder-panel builder-row">
    <label>Expiration
      <select x-model="expiration" @change="loadChain()">
        <template x-for="d in dates" :key="d"><option :value="d" x-text="d"></option></template>
      </select>
    </label>
    <label>Spot <input type="text" readonly :value="spot != null ? spot.toFixed(2) : '--'"></label>
    <label>IVR <input type="text" readonly :value="ivRankLabel"></label>
    <label>Strategy
      <select x-model="templateName" @change="templateChange()">
        <option value="">Custom</option>
        <option value="long_call">Long Call</option>
        <option value="long_put">Long Put</option>
        <option value="short_put">Short Put</option>
        <option value="covered_call">Covered Call</option>
        <option value="put_vertical_credit">Put Vertical (credit)</option>
        <option value="put_vertical_debit">Put Vertical (debit)</option>
        <option value="call_vertical_credit">Call Vertical (credit)</option>
        <option value="call_vertical_debit">Call Vertical (debit)</option>
        <option value="short_straddle">Short Straddle</option>
        <option value="short_strangle">Short Strangle</option>
        <option value="iron_condor">Iron Condor</option>
      </select>
    </label>
    <label>Price by
      <select x-model="priceBy" @change="priceByChange()">
        <option value="mid">Mid</option>
        <option value="natural">Bid/Ask</option>
      </select>
    </label>
  </section>

  <section class="builder-panel builder-row builder-top-row">
    <div class="builder-suggestions-col">
      <div class="builder-row" id="sentiment-row">
        <span class="chip-label">Suggestions</span>
        <button type="button" class="chip sentiment" :class="{on: sentiment === 'bullish'}" @click="loadSuggestions('bullish')">Bullish</button>
        <button type="button" class="chip sentiment" :class="{on: sentiment === 'bearish'}" @click="loadSuggestions('bearish')">Bearish</button>
        <button type="button" class="chip sentiment" :class="{on: sentiment === 'high_iv'}" @click="loadSuggestions('high_iv')">High Implied Volatility</button>
      </div>
      <p class="note" x-show="suggestionHeader" x-text="suggestionHeader"></p>
      <div id="suggestion-cards" class="suggestion-cards">
        <p class="loading" x-show="suggestionsLoading">Building suggestions…</p>
        <template x-for="(card, i) in suggestionCards" :key="i">
          <button type="button" class="suggestion-card" @click="applySuggestion(i)">
            <b x-text="templateLabel(card.name)"></b>
            <span x-html="miniPayoffSvg(card.curve)"></span>
            <span class="note" x-text="suggestionCardNote(card)"></span>
          </button>
        </template>
      </div>
      <div id="builder-warnings" x-html="warningsHtml"></div>
    </div>
    <div id="income-grid" class="analysis builder-income-grid" x-ref="incomeGrid" x-html="incomeGridHtml"></div>
  </section>

  <section class="builder-panel">
    <button type="button" id="builder-chain-toggle" class="builder-chain-toggle" @click="toggleChain()">
      <span x-text="chainCollapsed ? '▶' : '▾'"></span> Option chain
    </button>
    <div id="builder-chain" class="builder-chain" x-ref="chain" :class="{collapsed: chainCollapsed}" x-html="chainHtml"></div>
  </section>

  <section class="builder-panel builder-row">
    <div id="builder-basket" class="builder-basket">
      <h3>Legs</h3>
      <table id="leg-table">
        <thead>
          <tr class="leg-head" x-show="legs.length">
            <th>Action</th><th>Qty</th><th>Expiry</th><th>Strike</th><th>Type</th><th>Premium</th><th></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(leg, i) in legs" :key="i">
            <tr>
              <td>
                <select :value="String(leg.quantity > 0 ? 1 : -1)" @change="setLegAction(leg, parseInt($event.target.value, 10))">
                  <option value="1">Buy</option>
                  <option value="-1">Sell</option>
                </select>
              </td>
              <td><input type="number" min="1" :value="Math.abs(leg.quantity)" @change="setLegQty(leg, $event.target.value)"></td>
              <td class="note" x-text="leg.kind === 'stock' ? '--' : (leg.expiration || expiration || '--')"></td>
              <td>
                <template x-if="leg.kind !== 'stock'">
                  <select :value="leg.strike" @change="setLegStrike(leg, parseFloat($event.target.value))">
                    <template x-for="s in strikes" :key="s"><option :value="s" x-text="s"></option></template>
                  </select>
                </template>
                <span class="note" x-show="leg.kind === 'stock'">--</span>
              </td>
              <td>
                <template x-if="leg.kind !== 'stock'">
                  <select :value="leg.kind" @change="setLegKind(leg, $event.target.value)">
                    <option value="call">Call</option>
                    <option value="put">Put</option>
                  </select>
                </template>
                <span class="note" x-show="leg.kind === 'stock'">Stock</span>
              </td>
              <td><input type="number" step="0.01" :value="leg.price.toFixed(2)" @change="setLegPrice(leg, $event.target.value)"></td>
              <td><button type="button" title="remove" @click="removeLeg(i)">&times;</button></td>
            </tr>
          </template>
        </tbody>
      </table>
      <div class="builder-actions leg-controls">
        <span class="note">Add leg:</span>
        <button type="button" @click="addOption('call')">+ Call</button>
        <button type="button" @click="addOption('put')">+ Put</button>
        <button type="button" @click="addStock()">+ Stock</button>
      </div>
      <div class="builder-actions leg-controls">
        <button type="button" @click="flipStrategy()">Flip Strategy</button>
        <button type="button" @click="widthChange(-1)">&minus; Width</button>
        <button type="button" @click="widthChange(1)">Width +</button>
        <button type="button" @click="resetLegs()">Reset Legs</button>
      </div>
    </div>
    <div id="builder-metrics" class="builder-metrics" x-html="metricsHtml"></div>
  </section>

  <section class="builder-panel builder-row builder-chart-row">
    <svg id="builder-svg" class="builder-svg" viewBox="0 0 640 280" preserveAspectRatio="none" x-html="chartSvg"></svg>
    <div id="builder-strategy-card" class="analysis builder-strategy-text" x-html="strategyCardHtml"></div>
  </section>

  <section class="builder-panel builder-row">
    <label>Note <input type="text" placeholder="optional" x-model="note"></label>
    <div class="builder-actions">
      <button type="button" @click="validateOrder()">Validate with broker</button>
      <button type="button" @click="stageTicket()">Stage ticket</button>
    </div>
  </section>
  <p id="builder-validation" class="note" x-html="validationHtml"></p>
</div>
