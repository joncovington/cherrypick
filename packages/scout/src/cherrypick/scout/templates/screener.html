<div class="card" id="screener-view" data-strategy="$strategy">
  <h2>Screener <span class="note">put credit spread / call credit spread / short put / covered call</span></h2>
  <div class="builder-row">
    <label>Strategy
      <select id="screener-strategy">
        <option value="put_credit_spread">Put credit spread</option>
        <option value="call_credit_spread">Call credit spread</option>
        <option value="short_put">Short put</option>
        <option value="covered_call">Covered call</option>
      </select>
    </label>
  </div>
  <div id="screener-table"></div>
  <p id="screener-skipped" class="note"></p>
</div>
