[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-earnings"
version = "0.1.0"
description = "Earnings-play trading module — defined-risk strategies held overnight around a company's earnings report"
requires-python = ">=3.10"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this one.
# Not on PyPI (Private :: Do Not Upload) -- packages/core must be installed first, or resolution fails.
# mysql-connector-python speaks the MySQL wire protocol to the local `dolt sql-server` that serves the
# earnings/options/stocks datasets (see docs/01-setup.md).
dependencies = [
    "cherrypick-core",
    "tastytrade",
    "keyring",
    "mysql-connector-python",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
# The other six packages all set this; earnings didn't, which is why tests/conftest.py had to insert
# ../src onto sys.path by hand. With pythonpath set, that insert is redundant.
pythonpath = ["tests", "src"]

[tool.ruff]
# line-length + lint.select come from the suite-wide ../../ruff.toml.
extend = "../../ruff.toml"
target-version = "py310"
# .claude/commands is doc, not source — its fenced code blocks aren't meant to be reformatted.
extend-exclude = [".claude"]

[tool.ruff.lint]
# E501 (line length) deferred: high churn, low value across existing live code.
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
# Flat modules live under src/ and are imported top-level (pytest adds src to pythonpath); map the
# src/ prefix away so an editable install exposes them the same way. Same shape as the other modules.
only-include = ["src"]
sources = ["src"]
