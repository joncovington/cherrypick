[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cherrypick-technicals"
version = "0.1.0"
description = "The market report's end-of-day store and technical engines: adjusted daily bars, IV, and the readings built on them"
requires-python = ">=3.11"
license = "MIT"
# cherrypick-core is a sibling in-repo package (packages/core), installed editable alongside this
# one. Not on PyPI -- packages/core must be installed first, or resolution fails.
# mysql-connector-python speaks the MySQL wire protocol to the LOCAL `dolt sql-server` that serves
# the `stocks` and `options` clones (the same server the earnings module reads). Nothing here
# reaches the network: the clones are pulled by scripts/refresh_dolt_data.py, outside every package.
dependencies = ["cherrypick-core", "mysql-connector-python"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py311"

[tool.hatch.build.targets.wheel]
only-include = ["src/cherrypick"]
sources = ["src"]
