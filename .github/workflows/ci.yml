name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo-wide documentation guardrails (portable paths, no out-of-repo pointers, masked accounts,
  # no broken relative links). Separate from the package matrix because it is inherently cross-package
  # -- a link in one package's docs routinely points at another's.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The linter's own tests run first: a broken check reports OK over real errors, which has
      # already happened twice (a case-insensitive existence test passing on Windows while failing
      # here, and a path-normalization bug that called all 186 relative links broken).
      - name: Test the docs linter
        run: |
          pip install pytest
          python -m pytest tools/tests -q
      - name: Check docs guardrails
        run: python tools/check_docs.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, orchestrator, meic, earnings, gex, flies, streamer, scout, desk]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      # Headless CI runners have no OS keyring service; the orchestrator's auth-CLI subprocess
      # smoke test (test_onboarding.py) needs a real backend to exercise the keyring plumbing it
      # actually asserts on. keyrings.alt (an orchestrator dev-only dependency) supplies one.
      # No-op for every other package's job -- keyring reads OS-native backends unless this is set.
      PYTHON_KEYRING_BACKEND: ${{ matrix.package == 'orchestrator' && 'keyrings.alt.file.PlaintextKeyring' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # packages/core is not on PyPI (Private :: Do Not Upload); every consumer declares it as a
          # plain named dependency, resolved only from what's already installed -- so it must go first.
          if [ "${{ matrix.package }}" != "core" ]; then
            pip install -e ../core
          fi
          if [ "${{ matrix.package }}" == "core" ]; then
            # core's own broker/ tests (wait_for_order_alerts) deserialize real tastytrade alert
            # payloads via tastytrade.order.PlacedOrder -- a genuine dependency of the test, not
            # something auth.session's lazy-session-building invariant covers. Install the `broker`
            # extra too, so this is honest coverage rather than narrowed to fit a dev-only install.
            pip install -e ".[dev,broker]"
          else
            pip install -e ".[dev]"
          fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Test (pytest)
        run: pytest
