name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [orchestrator, meic, earnings, gex, flies, streamer]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      # Headless CI runners have no OS keyring service; the orchestrator's auth-CLI subprocess
      # smoke test (test_onboarding.py) needs a real backend to exercise the keyring plumbing it
      # actually asserts on. keyrings.alt (an orchestrator dev-only dependency) supplies one.
      # No-op for every other package's job -- keyring reads OS-native backends unless this is set.
      PYTHON_KEYRING_BACKEND: ${{ matrix.package == 'orchestrator' && 'keyrings.alt.file.PlaintextKeyring' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # each package's src/_core at its pinned cherrypick-core SHA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Test (pytest)
        run: pytest
